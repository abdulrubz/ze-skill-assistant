[project]
name = "ze-mock-services"
version = "0.1.0"
description = "Two dummy microservices (customers, orders) that stand in for real ones while ze-ai is built"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "pyjwt==2.10.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
