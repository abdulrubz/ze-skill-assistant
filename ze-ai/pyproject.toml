[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "ze-ai"
version = "0.1.0"
description = "GenAI service: agents -> skills -> tools generated from the org's OpenAPI specs"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain==1.4.0",
    "langchain-core==1.6.9",
    # The only model client: MLflow's gateway speaks the OpenAI chat shape on
    # its provider-agnostic route (app/llm.py).
    "langchain-openai==1.7.0",
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "httpx==0.28.1",
    "pydantic>=2.11.10,<3",
    "pydantic-settings==2.7.1",
    "python-dotenv>=1.0",
    "PyYAML==6.0.2",
    "aiosqlite==0.21.0",
    # Builds the HTTP tools from each service's OpenAPI spec (app/tools/openapi/).
    # 3.3+ pulls starlette 1.x, past fastapi 0.121's starlette<0.50.
    "fastmcp==3.2.4",
    "starlette==0.49.3",
    # Tracing, prompt management and evals. Imported lazily: with no keys set
    # nothing is imported and no network call is made.
    "langfuse==4.15.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.2"]
# Only scripts/mlflow_gateway.py needs mlflow (to provision endpoints). The
# service itself talks to the gateway over plain HTTP.
gateway = ["mlflow>=3.17,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
