# Every change to a service spec must pass the convention check.
name: api-specs
on:
  push:
    branches: [main]
    paths: ["ze-api-specs/**"]
  pull_request:
    paths: ["ze-api-specs/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python ze-api-specs/scripts/validate.py
