name: mock-services
on:
  push:
    branches: [main]
    paths: ["ze-mock-services/**"]
  pull_request:
    paths: ["ze-mock-services/**"]
defaults:
  run:
    working-directory: ze-mock-services
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/pytest -q
